name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.16"
      - run: ruff check .

  js-syntax:
    # Não executa o JS, mas impede que um arquivo quebrado chegue à main:
    # um erro de sintaxe em app.js derruba todas as telas.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: for f in static/js/*.js; do node --check "$f"; done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      # pytest-django roda os mesmos TestCase do `manage.py test`, e o
      # pyproject.toml liga a cobertura: abaixo de 80% o job falha.
      - run: pytest
